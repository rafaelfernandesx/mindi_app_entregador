name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Localizar o projeto pela pasta app_src
        run: |
          APPSRC=$(find . -type d -name app_src -not -path './.git/*' | head -1)
          SRC=$(dirname "$APPSRC")
          echo "Projeto encontrado em: $SRC"
          if [ "$SRC" != "." ]; then
            cp -r "$SRC"/. .
          fi
          ls -la

      - name: Criar a estrutura Android
        run: flutter create . --org com.mindi --project-name entregador --platforms=android

      - name: Liberar internet, localizacao e notificacao no Android
        run: |
          python3 - <<'EOF'
          caminho = 'android/app/src/main/AndroidManifest.xml'
          xml = open(caminho, encoding='utf-8').read()
          extras = ''
          if 'android.permission.INTERNET' not in xml:
              extras += '\n    <uses-permission android:name="android.permission.INTERNET"/>'
          if 'ACCESS_FINE_LOCATION' not in xml:
              extras += ('\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
                         '\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>')
          if 'POST_NOTIFICATIONS' not in xml:
              extras += ('\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
                         '\n    <uses-permission android:name="android.permission.VIBRATE"/>'
                         '\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>')
          if '<queries>' not in xml:
              extras += ('\n    <queries>'
                         '\n        <intent><action android:name="android.intent.action.VIEW"/>'
                         '<data android:scheme="https"/></intent>'
                         '\n        <intent><action android:name="android.intent.action.DIAL"/>'
                         '<data android:scheme="tel"/></intent>'
                         '\n    </queries>')
          if extras:
              i = xml.index('>', xml.index('<manifest')) + 1
              xml = xml[:i] + extras + xml[i:]
              print('permissoes adicionadas')

          # nome que aparece embaixo do icone no celular
          import re as _re
          xml = _re.sub(r'android:label="[^"]*"',
                        'android:label="Mindi - Entregadores"', xml, count=1)

          open(caminho, 'w', encoding='utf-8').write(xml)
          print('manifest atualizado')
          EOF
          head -14 android/app/src/main/AndroidManifest.xml

      - name: Configurar o Firebase (notificacoes)
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERRO: google-services.json nao encontrado na pasta do projeto."
            exit 1
          fi
          cp google-services.json android/app/google-services.json

          NDK=$(ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then NDK=27.0.12077973; fi
          echo "NDK escolhido: $NDK"

          NDK="$NDK" python3 - <<'EOF'
          import os, re

          ndk = os.environ['NDK']
          pacote = 'com.mindi.entregador'

          # acrescenta uma linha NO FIM do bloco plugins { }
          # (o google-services precisa vir depois do plugin do Android)
          def add_plugin(txt, linha):
              i = txt.index('plugins {')
              fim = txt.index('}', i)
              return txt[:fim] + linha + txt[fim:]

          app = 'android/app/build.gradle.kts'
          if not os.path.exists(app):
              app = 'android/app/build.gradle'
          cfg = 'android/settings.gradle.kts'
          if not os.path.exists(cfg):
              cfg = 'android/settings.gradle'
          kts = app.endswith('.kts')

          # ---- settings.gradle: declara o plugin do Google Services ----
          s = open(cfg, encoding='utf-8').read()
          if 'com.google.gms.google-services' not in s:
              linha = ('    id("com.google.gms.google-services") version "4.4.2" apply false\n'
                       if cfg.endswith('.kts') else
                       '    id "com.google.gms.google-services" version "4.4.2" apply false\n')
              s = add_plugin(s, linha)
              open(cfg, 'w', encoding='utf-8').write(s)
              print('settings.gradle atualizado')

          # ---- app/build.gradle: aplica o plugin + ajustes ----
          a = open(app, encoding='utf-8').read()

          if 'com.google.gms.google-services' not in a:
              linha = ('    id("com.google.gms.google-services")\n' if kts
                       else '    id "com.google.gms.google-services"\n')
              a = add_plugin(a, linha)

          # id do aplicativo tem que bater com o google-services.json
          a = re.sub(r'(applicationId\s*=\s*)"[^"]*"', r'\1"%s"' % pacote, a)
          a = re.sub(r'(applicationId\s+)"[^"]*"', r'\1"%s"' % pacote, a)

          # Firebase precisa de Android 6 pra cima
          a = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', a)
          a = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', a)

          # versao do NDK que existe nesta maquina
          if 'ndkVersion' in a:
              a = re.sub(r'ndkVersion\s*=\s*[^\n]+', 'ndkVersion = "%s"' % ndk, a) if kts \
                  else re.sub(r'ndkVersion\s+[^\n]+', 'ndkVersion "%s"' % ndk, a)
          else:
              i = a.index('android {')
              j = a.index('\n', i) + 1
              linha = ('    ndkVersion = "%s"\n' % ndk) if kts else ('    ndkVersion "%s"\n' % ndk)
              a = a[:j] + linha + a[j:]

          open(app, 'w', encoding='utf-8').write(a)
          print('build.gradle atualizado')
          EOF

          echo '--- settings ---'; grep -n "google-services" android/settings.gradle* || true
          echo '--- app ---'; grep -n "google-services\|applicationId\|minSdk\|ndkVersion" android/app/build.gradle* || true

      - name: Colocar o codigo das telas no lugar certo
        run: |
          mkdir -p lib
          cp app_src/*.dart lib/
          # o teste de exemplo criado pelo flutter create atrapalha a analise
          rm -rf test
          ls lib

      - name: Garantir o pacote de idioma portugues
        run: flutter pub add flutter_localizations --sdk=flutter || true

      - name: Garantir os pacotes extras
        run: |
          grep -q "firebase_core" pubspec.yaml || flutter pub add firebase_core
          grep -q "firebase_messaging" pubspec.yaml || flutter pub add firebase_messaging
          grep -q "lucide_icons_flutter" pubspec.yaml || flutter pub add lucide_icons_flutter
          grep -q "google_fonts" pubspec.yaml || flutter pub add google_fonts
          cat pubspec.yaml

      - name: Baixar dependencias
        run: flutter pub get

      - name: Conferir se o codigo compila
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Compilar o APK
        run: flutter build apk --release

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: app-entregador-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
